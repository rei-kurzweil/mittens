[package]
name = "mitten-droid"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
description = "Android application host for Mittens Engine"

[lib]
crate-type = ["cdylib"]

[features]
default = ["mobile-renderer"]
xr-probe = ["dep:openxr", "dep:jni"]
vulkan-probe = ["xr-probe", "dep:ash"]
mobile-renderer = ["vulkan-probe"]

[build-dependencies]
shaderc = "0.8.3"

[target.'cfg(target_os = "android")'.dependencies]
# Match the working ALVR client: 0.6.1 changed the ndk-context object from
# Activity to Application, which caused freezes in that client's dependencies.
android-activity = { version = "=0.6.0", features = ["native-activity"] }
android_logger = { version = "0.14", default-features = false }
ash = { version = "0.38", optional = true }
jni = { version = "0.21", optional = true }
log = "0.4"
mittens-engine = { path = "..", default-features = false }
ndk-context = "0.1"
openxr = { version = "0.19", optional = true }

[package.metadata.android]
package = "org.mittens.engine.dev"
build_targets = ["aarch64-linux-android"]
runtime_libs = "../target/android-runtime-libs"
assets = "packaging/notices"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 32

[package.metadata.android.application]
label = "Mittens Host"
theme = "@android:style/Theme.Black.NoTitleBar.Fullscreen"
debuggable = true

[package.metadata.android.application.activity]
config_changes = "density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"
launch_mode = "singleTask"
orientation = "landscape"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = [
    "android.intent.category.LAUNCHER",
    "org.khronos.openxr.intent.category.IMMERSIVE_HMD",
]

[[package.metadata.android.uses_feature]]
name = "android.hardware.vr.headtracking"
required = true
version = 1

[[package.metadata.android.uses_permission]]
name = "org.khronos.openxr.permission.OPENXR"
[[package.metadata.android.uses_permission]]
name = "org.khronos.openxr.permission.OPENXR_SYSTEM"
[[package.metadata.android.queries.intent]]
actions = ["org.khronos.openxr.OpenXRRuntimeService"]
[[package.metadata.android.queries.provider]]
name = "org.khronos.openxr"
authorities = "org.khronos.openxr.runtime_broker;org.khronos.openxr.system_runtime_broker"

# Focus 3 launcher metadata, following the local ALVR client.
[[package.metadata.android.application.meta_data]]
name = "minWaveSDKVersion"
value = "1"
[[package.metadata.android.application.meta_data]]
name = "com.htc.vr.content.NumController"
value = "1,2"
[[package.metadata.android.application.meta_data]]
name = "com.htc.vr.content.NumDoFController"
value = "6DoF"
[[package.metadata.android.application.meta_data]]
name = "com.htc.vr.content.NumDoFHmd"
value = "6DoF"
